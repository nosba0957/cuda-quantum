name: "quantum_machines"
description: "CUDA-Q target for Quantum Machines."

config:
  # Tell DefaultQuantumPlatform what QPU subtype to use
  platform-qpu: remote_rest
  # Add the rest-qpu library to the link list
  link-libs: ["-lcudaq-rest-qpu"]
  # Tell NVQ++ to generate glue code to set the target backend name
  gen-target-backend: true
  # Add preprocessor defines to compilation
  preprocessor-defines: ["-D CUDAQ_QUANTUM_DEVICE"]
  # Define the JIT lowering pipeline
  jit-mid-level-pipeline: "lower-to-cfg,decomposition{basis=h,s,t,r1,rx,ry,rz,x,y,z,x(1)},quake-to-cc-prep,func.func(expand-control-veqs,combine-quantum-alloc,canonicalize,combine-measurements)"
  # Tell the rest-qpu that we are generating OpenQASM 2.0.
  codegen-emission: qasm2

target-arguments:
  - key: url
    required: true
    type: string
    platform-arg: url
    help-string: "Specify Quantum Machine base server url."
  - key: executor
    required: false
    type: string
    platform-arg: executor
    help-string: "Specify the executor to run. Default is mock"
  - key: api_key
    required: false
    type: string
    platform-arg: api_key
    help-string: "An API key to access the Qoperator server"
  - key: qm-config
    required: false
    type: string
    platform-arg: qm_config
    help-string: "Path to the serialized QuaConfig (qua_config.pb) for the chip. Also settable at run time as `--qm-config <path>` or $CUDAQ_QM_CONFIG."
  - key: qm-endpoint
    required: false
    type: string
    platform-arg: qm_endpoint
    help-string: "QOP gRPC endpoint as host:port, e.g. 10.21.19.201:9514. Run-time equivalent: `--qm-endpoint`."
  - key: qm-cluster
    required: false
    type: string
    platform-arg: qm_cluster
    help-string: "QOP cluster name the gateway routes by. Run-time equivalent: `--qm-cluster`."
  - key: qm-builder
    required: false
    type: string
    platform-arg: qm_builder
    help-string: "Path to tools/qua_build.py, run once per circuit structure. Run-time equivalent: `--qm-builder`."
  
